<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title and page.url != '/' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  <script src="{{ '/assets/site.js' | relative_url }}" type="module"></script>
</head>
<body id="top">
  <a class="skip" href="#main">Skip to main content</a>
  <header class="header">
    <div class="shell header-inner">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">ZT</span><span>Zuoxun Tan</span></a>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/#publications' | relative_url }}">Publications</a>
        <a href="{{ '/notes/' | relative_url }}">Notes</a>
        <a href="{{ '/#about' | relative_url }}">About</a>
      </nav>
      <button class="theme" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" hidden><span aria-hidden="true">☾</span></button>
    </div>
  </header>
  {% if page.hero %}{% include intro.html %}{% endif %}
  <div class="shell page-frame">
    <main class="content" id="main">
      {{ content }}
    </main>
    {% include sidebar.html %}
  </div>
  <footer class="footer"><div class="shell footer-inner"><span>Zuoxun Tan</span><a href="#top">Back to top <span aria-hidden="true">↑</span></a></div></footer>
</body>
</html>
