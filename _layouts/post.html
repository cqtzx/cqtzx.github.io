---
layout: default
---

<header class="page-head">
  <p class="eyebrow">Research note</p>
  <h1>{{ page.title | escape }}</h1>
  <p>{{ page.description | escape }}</p>
</header>

<article class="surface prose">
  {{ content }}
  {% if page.paper_url %}
  <p><a class="text-link" href="{{ page.paper_url }}">Read the paper <span aria-hidden="true">↗</span></a></p>
  {% endif %}
</article>

<p><a class="text-link" href="{{ '/notes/' | relative_url }}"><span aria-hidden="true">←</span> Back to research notes</a></p>
